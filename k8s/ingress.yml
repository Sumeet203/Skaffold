apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: skaffold-demo-ingress

spec:
  ingressClassName: nginx

  rules:
    - host: skaffold-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skaffold-demo-service
                port:
                  number: 3000